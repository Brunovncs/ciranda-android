# A tag vX.Y.Z builds the signed APK and publishes it as a GitHub release, which the app's updater
# finds (app/src/main/kotlin/app/ciranda/android/Updater.kt): `ciranda-X.Y.Z-android.apk` and its
# SHA-256. The tag must match the version in rust/Cargo.toml.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NDK_VERSION: "30.0.16248370"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match rust/Cargo.toml version $v"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --locked

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-android-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: rust-android-

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CIRANDA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::CIRANDA_KEYSTORE_BASE64 is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CIRANDA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          CIRANDA_KEYSTORE_PASSWORD: ${{ secrets.CIRANDA_KEYSTORE_PASSWORD }}
          CIRANDA_KEY_ALIAS: ${{ secrets.CIRANDA_KEY_ALIAS }}
          CIRANDA_KEY_PASSWORD: ${{ secrets.CIRANDA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -Pabis=arm64-v8a --console=plain

      - name: Package
        id: package
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ciranda-$v-android.apk"
          cd dist
          sha256sum "ciranda-$v-android.apk" > "ciranda-$v-android.apk.sha256"
          # A release must be signed with the release key, or installed copies could never update to it.
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "ciranda-$v-android.apk" | tee certs.txt
          if grep -q "CN=Android Debug" certs.txt; then echo "::error::signed with the debug key"; exit 1; fi
          rm certs.txt

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          git log -1 --format=%b "${GITHUB_REF_NAME}" > notes.md
          [ -s notes.md ] || echo "Ciranda $v para Android." > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Ciranda $v para Android" --notes-file notes.md

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: apk
          path: dist/
