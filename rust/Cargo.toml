[package]
name = "ciranda-mobile"
description = "Ciranda for Android: the desktop client's core and media, driven from Kotlin"
version = "0.2.2"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
name = "ciranda"
crate-type = ["cdylib", "rlib"]

# Versions as the desktop client pins them (ciranda/client/Cargo.toml): the modules below are its
# own files, compiled here as they are.
[dependencies]
libwebrtc = "0.3.51"
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = { version = "0.18" }
dirs = "7"
futures = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "charset", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
rtrb = "0.3"
rubato = { version = "5.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallvec = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "ogg", "vorbis", "flac", "pcm", "aac", "isomp4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["__rustls-tls"] }
tract-onnx = "0.23"
tract-pulse = "0.23"
realfft = "3"
url = "2"
emojis = "0.9"
unicode-segmentation = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.15"
jni22 = { package = "jni", version = "0.22" }

# Only so the crate also builds on Windows, for the voice bot in examples/ (the desktop's own
# files ask for these there).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }

[build-dependencies]
webrtc-sys-build = "0.3"

[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
